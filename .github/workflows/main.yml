name: ClashForge

on:
  # schedule:
  #   - cron: '30 21 * * *'
  push:
    paths:
      - 'ClashForge.py'              
      - '.github/workflows/main.yml'   
      - 'requirements.txt'  
      - 'README.md'
  workflow_dispatch:                 

jobs:
  run_demo_actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 使用你设置的 BOT Token
          token: ${{ secrets.BOT }}

      - name: Set up Python
        uses: actions/setup-python@v4  # 升级到了较新且稳定的 v4 版本
        with:
          python-version: '3.10.10'

      - name: Install requirements.txt
        run: |
          if [ -f ./requirements.txt ]; then
            pip install -r ./requirements.txt
          else
            echo "requirements.txt not found, installing default packages..."
            pip install requests requests-html pyyaml httpx
          fi

      - name: Run ClashForge.py
        run: python ClashForge.py

      - name: Commit and push file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 检查是否有文件变动，避免 commit 失败
          git add clash_config.yaml
          if git diff --staged --quiet; then
            echo "No changes in clash_config.yaml, skipping commit."
          else
            git commit -m "Auto update clash_config.yaml [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push https://${{ secrets.BOT }}@github.com/${GITHUB_REPOSITORY}.git HEAD:main
          fi
