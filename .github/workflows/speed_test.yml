name: speed_test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
  push:
    paths:
      - 'speed_test.py'
      - '.github/workflows/speed_test.yml'
      - 'nodes.txt'



jobs:
  run-speed-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，这对 rebase 至关重要

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml requests pytz geoip2

      - name: Run Speed Test Script
        run: python speed_test.py

      - name: Commit and Push Changes
        run: |
          # 1. 配置身份信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 2. 暂存所有变动（解决 "unstaged changes" 报错的核心）
          # 使用 . 会包含新创建的日期文件夹和所有修改
          git add .
          
          # 3. 检查是否有真正需要提交的内容
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push."
          else
            git commit -m "Auto: Update fast nodes $(date '+%Y-%m-%d %H:%M:%S')"
            
            # 4. 稳健的推送逻辑
            # --rebase 会把你的本地提交提到远程最新提交之后
            # 如果 rebase 失败，通常是因为文件冲突，这里强制拉取最新状态
            git pull --rebase origin main
            
            # 5. 推送
            git push origin main
          fi
