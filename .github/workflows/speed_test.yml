name: speed_test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # 每3小时运行一次
  push:
    paths:
      - 'speed_test.py'
      - '.github/workflows/speed_test.yml'
      - 'nodes.txt'

jobs:
  run-speed-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml requests pytz geoip2

      - name: Download GeoIP Database
        run: |
          wget -O GeoLite2-Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Speed Test Script
        run: python speed_test.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 包含所有新生成的日期文件夹和 CSV 记录
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push."
          else
            # 使用上海时间作为 commit 信息
            export TZ='Asia/Shanghai'
            git commit -m "Auto: Update nodes & speed history $(date '+%Y-%m-%d %H:%M:%S')"
            
            # 循环尝试 rebase 以应对并发冲突
            SUCCESS=0
            for i in {1..5}; do
              if git pull --rebase origin main && git push origin main; then
                SUCCESS=1
                break
              fi
              echo "Conflict detected, retrying in 5s..."
              sleep 5
            done
            
            if [ $SUCCESS -ne 1 ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi
