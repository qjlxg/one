name: speed_test

on:
  workflow_dispatch:
  push:
    paths:
      - 'speed_test.py'
      - '.github/workflows/speed_test.yml'

jobs:
  run-speed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml requests pytz

      - name: Run Speed Test Script
        run: python speed_test.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 添加新生成的文件和变动的文件
          git add nodes_list_fast.txt README.md YYYY/MM/*.txt
          # 仅在有变动时提交
          if git diff --staged --quiet; then
            echo "没有发现变动，跳过提交"
          else
            git commit -m "Auto: 更新测速精选列表 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
